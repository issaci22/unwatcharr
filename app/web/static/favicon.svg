<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!-- Unwatcharr mark: a skip-back control - the track bar the playhead
       returns to, and a rewind triangle driving into it.
       Brand teal reads on both a light and a dark browser tab. -->
  <line x1="5" y1="4" x2="5" y2="20" fill="none" stroke="#2fab9e" stroke-width="2"
        stroke-linecap="round"/>
  <polygon points="19,20 9,12 19,4" fill="#2fab9e" stroke="#2fab9e" stroke-width="2"
           stroke-linejoin="round"/>
</svg>
