# Build-from-source compose file. Use this on your workstation, or once over SSH
# on the NAS to produce the `unwatcharr:latest` image that
# docker-compose.truenas.yml then consumes.
#
#   docker compose up -d --build

services:
  unwatcharr:
    build: .
    image: unwatcharr:latest
    container_name: unwatcharr
    ports:
      - "8577:8577"
    volumes:
      - ./config:/config
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PORT: "8577"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional pre-seeds, applied on FIRST BOOT ONLY. The setup wizard can
      # discover all of this instead.
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    mem_limit: 256m
    restart: unless-stopped
